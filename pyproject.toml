[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-coded-agents-sdlc"
version = "0.1.0"
description = "MIT Graph Harness execution kernel plus original provider-neutral Coded Agents governance adapter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Graph Coded Agents SDLC contributors" }]
dependencies = []

[project.scripts]
graph-harness = "graph_harness.cli:main"
coded-agents-sdlc = "coded_agents_sdlc.cli:main"

[tool.setuptools.packages.find]
include = ["graph_harness*", "coded_agents_sdlc*"]
